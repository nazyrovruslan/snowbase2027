name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # проверка сборки по контракту DSFC/1 (без браузера)
      - run: python3 tools/dsfc_check.py dist
      # тестовый сайт: не индексировать, без Метрики; canonical — на прод
      - run: >-
          node scripts/export.mjs static
          --base /${{ github.event.repository.name }}/
          --site-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          --canonical https://southhub.ru/snowbase/
          --noindex
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
