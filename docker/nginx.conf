# Лендинг Snow BASE: отдаётся по адресу /snowbase/ (как https://southhub.ru/snowbase/).
# Основной nginx southhub.ru проксирует /snowbase/ в этот контейнер без изменения пути.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # за прокси: редиректы относительные, без внутреннего хоста/порта
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml
               application/manifest+json font/ttf application/x-font-ttf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / { return 301 /snowbase/; }
    location = /snowbase { return 301 /snowbase/; }

    location /snowbase/ {
        # /snowbase/ → index.html (через index, чтобы сработало правило для .html ниже)
        try_files $uri $uri/ =404;
        error_page 404 /snowbase/404.html;

        # HTML всегда свежий
        location ~* \.html$ {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        # файлы сборки с хэшем в имени — кэш навсегда
        location ^~ /snowbase/_nuxt/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # манифест: в стандартном mime.types nginx нет .webmanifest
        location ~* \.webmanifest$ {
            default_type application/manifest+json;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # фавиконки, og-картинка
        location ~* \.(ico|png|jpg|jpeg|webp|svg)$ {
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }
    }
}
